{% extends "base.html" %}
{% block title %}Edit Task{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <section class="panel">
      <div class="panel-heading">
        <div><div class="eyebrow">MAKE AN UPDATE</div><h2>Edit task</h2></div>
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm">← Back</a>
      </div>
      <form method="post" action="{{ url_for('edit_task', task_id=task.id) }}">
        <div class="mb-3">
          <label class="form-label" for="title">Task title *</label>
          <input class="form-control" id="title" name="title" maxlength="160" value="{{ task.title }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="description">Description</label>
          <textarea class="form-control" id="description" name="description" rows="4" maxlength="1000">{{ task.description }}</textarea>
        </div>
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label" for="category">Category</label>
            <select class="form-select" id="category" name="category">
              {% for option in ['Personal', 'Work', 'Study', 'Shopping', 'Health'] %}
              <option {{ 'selected' if task.category == option else '' }}>{{ option }}</option>
              {% endfor %}
              {% if task.category not in ['Personal', 'Work', 'Study', 'Shopping', 'Health'] %}
              <option selected>{{ task.category }}</option>
              {% endif %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="priority">Priority</label>
            <select class="form-select" id="priority" name="priority">
              {% for option in ['Low', 'Medium', 'High'] %}
              <option {{ 'selected' if task.priority == option else '' }}>{{ option }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="due_date">Due date</label>
            <input class="form-control" type="date" id="due_date" name="due_date" value="{{ task.due_date }}">
          </div>
        </div>
        <div class="d-flex gap-2 mt-4">
          <button class="btn btn-primary px-4" type="submit">Save changes</button>
          <a class="btn btn-light px-4" href="{{ url_for('index') }}">Cancel</a>
        </div>
      </form>
    </section>
  </div>
</div>
{% endblock %}
